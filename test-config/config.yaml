radiod:
  status_group: hf-status.local:5006
  data_group: pcm.local:5004
  interface: lo

multicast_relay:
  enabled: false
  attempt_mdns_lookup: false
  ttl_increment: 1        # Increment TTL for multicast packets (default: 1)
  host_interface: auto    # Host network interface (default: auto, or specify like 'eth0', 'eno1')
  # extra_groups: additional multicast streams to relay beyond status_group and data_group
  # Useful for relaying per-band IQ streams generated by ka9q-radio demod sections.
  # Each entry is a hostname (with optional :port) matching a 'data =' value in radiod.conf.
  # The multicast IP is resolved via mDNS or derived using the same FNV-1 hash as ka9q-radio.
  extra_groups:
    - websdrLF.local
    - websdr160m.local
    - websdr80m.local
    - websdr40m.local
    - websdr20m.local
    - websdr10m.local
